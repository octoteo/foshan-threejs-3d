<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#eaf0f4" />
  <meta name="description" content="佛山数字城市：2D/3D 一体地图、真实路网水系、开放建筑与高精地标扩展底座" />
  <title>佛山数字城市 · Stage 2</title>
</head>
<body>
  <div id="app">
    <div id="map" aria-label="佛山数字城市地图"></div>
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-mark">FS</div>
        <div><strong>佛山数字城市</strong><span>Stage 2 · MapLibre + Overture + Three.js-ready</span></div>
      </div>
      <div class="toolbar">
        <span id="modeBadge" class="mode-badge">2D 地图</span>
        <div class="mode-switch" role="group" aria-label="地图维度">
          <button id="mode2dBtn" class="btn active">2D</button>
          <button id="mode3dBtn" class="btn">3D</button>
        </div>
        <button id="homeBtn" class="btn desktop-only">佛山全景</button>
        <button id="legacyBtn" class="btn desktop-only">旧版 Three.js</button>
      </div>
    </header>
    <aside id="landmarkPanel" class="landmark-panel glass">
      <div class="panel-head"><strong>重点地标 · 高精模型位</strong><button id="landmarkToggle" aria-label="收起地标">‹</button></div>
      <div id="landmarkList" class="landmark-list"></div>
    </aside>
    <aside class="telemetry glass">
      <div><span>FPS</span><strong id="fps">--</strong></div>
      <div><span>模式</span><strong id="pitchStats">0°</strong></div>
      <div><span>缩放</span><strong id="zoomStats">--</strong></div>
      <div><span>坐标</span><strong id="coordStats">--</strong></div>
    </aside>
    <div id="status" class="status glass">正在初始化城市地图…</div>
    <div class="road-note glass">道路、水系、地名来自开放矢量数据；3D 建筑叠加 Overture Maps。地理事实与高精地标资产分层管理。</div>
  </div>
  <script>document.documentElement.dataset.shellReady = "true";</script>
  <script type="module" src="./src/stage2/diagnostics.js"></script>
  <script type="module" src="./src/stage2/main.js"></script>
</body>
</html>
