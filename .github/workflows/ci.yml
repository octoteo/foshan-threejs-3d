name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked runtime/build dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Bootstrap lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock browser dependencies"
          git push
      - name: Static and algorithm checks
        run: npm run check
      - name: Production bundle
        run: npm run build
      - name: Verify live Foshan open-data endpoints
        run: npm run network-smoke
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/foshan-server.log 2>&1 &
          echo $! > /tmp/foshan-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/foshan-server.log
          exit 1
      - name: Browser smoke with bundled production app
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=30000 --window-size=1440,900 \
            --screenshot=/tmp/foshan-v1.png http://127.0.0.1:4173/ || true
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=34000 --window-size=1440,900 \
            --dump-dom http://127.0.0.1:4173/ > /tmp/foshan-dom.html
          grep -q 'data-shell-ready="true"' /tmp/foshan-dom.html
          grep -q 'data-app-ready="true"' /tmp/foshan-dom.html || {
            grep -o '<div id="status"[^>]*>[^<]*' /tmp/foshan-dom.html || true
            exit 1
          }
          BUILDING_COUNT="$(grep -o '<strong id="buildingStats">[0-9,]* 栋' /tmp/foshan-dom.html | head -1 | sed -E 's/.*>([0-9,]+) 栋/\1/' | tr -d ',')"
          test -n "$BUILDING_COUNT"
          test "$BUILDING_COUNT" -gt 0
          test -s /tmp/foshan-v1.png
      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foshan-v1-dist
          path: dist
          retention-days: 14
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foshan-v1-browser-evidence
          path: |
            /tmp/foshan-v1.png
            /tmp/foshan-dom.html
            /tmp/foshan-server.log
          if-no-files-found: ignore
          retention-days: 14
